name: VodRecoveryTV
options:
  bundleIdPrefix: com.mehdisenhaj
  deploymentTarget:
    tvOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  VodRecoveryTV:
    type: application
    platform: tvOS
    sources:
      - Sources
      - Resources
    settings:
      base:
        PRODUCT_NAME: VodRecoveryTV
        PRODUCT_BUNDLE_IDENTIFIER: com.mehdisenhaj.vodrecovery
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "3"
        ENABLE_PREVIEWS: NO
